# The Pages project slidr-media, where the app reads the media library (README, "Publishing the
# uploads"). It holds no files of its own: its Worker (public/_worker.js) sends every request to
# the library's Worker, which serves the library from its bucket.
#
#   cd media-site
#   npx wrangler pages deploy
name = "slidr-media"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "LIBRARY"
service = "library"
