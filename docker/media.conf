# /media/ (docs/SPEC.md §4.6): the media folder itself, answered as the library's own server
# answers it (server/core/media/serve.ts): the same types, caching and headers, and 404 for a
# file that is not there or that is no path of the library. The folder is the library's alone
# (D13): what a publication writes before its rename, and its probe, have hidden names.
alias /library/media/;
autoindex off;
disable_symlinks on;
etag on;
include /etc/nginx/slidr/media-types.conf;
# A link, which is never followed, is answered as a file that is not there.
error_page 403 404 = @missing;
include /etc/nginx/slidr/media-methods.conf;

# What isLibraryPath of live.ts refuses: a first `_`, a hidden part (`.git`, `.slidr-…`), `\`,
# `:`, an empty part, and a folder.
location ~ "^/media/_|/\.|\x5c|:|//|/$" {
    return 404;
}

location = /media/manifest.json {
    alias /library/media/manifest.json;
    include /etc/nginx/slidr/media-methods.conf;
    include /etc/nginx/slidr/media-headers.conf;
    add_header Cache-Control "no-cache" always;
}

try_files $uri =404;
include /etc/nginx/slidr/media-headers.conf;
add_header Cache-Control "public, max-age=0, must-revalidate" always;
