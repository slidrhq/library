# The headers of every answer of /media/, as serve.ts gives them: any page may read the library,
# and X-Slidr-Library says it is served from its store. The sandbox runs no file of the media at
# the library's own origin, where its page and its session are (an HTML file of the library is
# read as text by the app).
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, If-None-Match" always;
add_header Access-Control-Expose-Headers "ETag" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Slidr-Library "live" always;
add_header Content-Security-Policy "sandbox" always;
