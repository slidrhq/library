# A request passed to the library's server on Node (nginx.conf): with the address it came from,
# and the scheme and the name it was reached by, which Node takes from this proxy of its own.
proxy_pass http://library;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $slidr_proto;
proxy_set_header X-Forwarded-Host $slidr_forwarded_host;
# An upload goes to the server as it comes, never first into /tmp.
proxy_request_buffering off;
# Approving publishes, and a seed copies a batch: they answer when they are done.
proxy_read_timeout 600s;
proxy_send_timeout 600s;
