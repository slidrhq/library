# The methods /media/ takes, as serve.ts takes them: GET and HEAD, and OPTIONS for a page that
# asks first. Included in each location of media.conf, since an `if` holds for its own alone.
if ($request_method = OPTIONS) {
    include /etc/nginx/slidr/media-headers.conf;
    return 204;
}
if ($request_method !~ ^(GET|HEAD)$) {
    include /etc/nginx/slidr/media-headers.conf;
    add_header Allow "GET, HEAD, OPTIONS" always;
    return 405;
}
