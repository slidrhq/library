# The image's Nginx (docs/SPEC.md D14, §4.6): the container's only door, on 8080. It serves the
# media from its folder and the page's built files, and passes the rest to the library's server,
# Node on 127.0.0.1:5176. What depends on the install (TLS, the organization's proxy) the entry
# writes into /tmp/nginx/ before Nginx starts (slidr-library-entry).
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    # The root file system is read-only: what Nginx keeps for a while is in /tmp.
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # The path alone: the owner's one-time link carries its code in the query, never kept.
    log_format slidr '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout slidr;

    upstream library {
        server 127.0.0.1:5176;
        keepalive 16;
    }

    server {
        include /tmp/nginx/listen.conf;
        include /tmp/nginx/proxy.conf;

        # `//` is no path of the library: it is refused, not taken for `/` (media.conf).
        merge_slashes off;
        # The largest request the library takes: a file of an author's publication (95 MiB).
        client_max_body_size 100m;

        location ^~ /media/ {
            include /etc/nginx/slidr/media.conf;
        }

        # What /media/ answers for a file that is not there, as the library's server does.
        location @missing {
            include /etc/nginx/slidr/media-headers.conf;
            add_header Cache-Control "no-store" always;
            types { }
            default_type text/html;
            charset utf-8;
            return 404 '<!doctype html><meta charset="utf-8"><title>Not found</title><p>Slidr media library: no such file.</p>\n';
        }

        # The page's files, named by their content: kept a year.
        location ^~ /assets/ {
            root /app/dist/client;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # The page itself, signing in and the API: the library's server.
        location / {
            proxy_pass http://library;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $slidr_proto;
            proxy_set_header X-Forwarded-Host $slidr_forwarded_host;
            # An upload goes to the server as it comes, never first into /tmp.
            proxy_request_buffering off;
            # Approving publishes, and a seed copies a batch: they answer when they are done.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
