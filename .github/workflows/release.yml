name: Release

# A release of the local library (docs/PLAN.md P13), from a tag v<version> that package.json names:
# its image for x86-64 and ARM64 on ghcr.io, attested; that image tried as a machine pulls it; and
# a GitHub release with the install script that pins it by digest. It deploys nothing to
# Cloudflare (deploy.yml does, from main).
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

env:
  REPOSITORY: ghcr.io/slidrhq/library

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: The tag is package.json's version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "The tag $GITHUB_REF_NAME is not v$version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  image:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.list.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One image for both architectures, tagged
        id: list
        run: |
          version=${{ needs.check.outputs.version }}
          docker buildx imagetools create \
            --tag "$REPOSITORY:$version" --tag "$REPOSITORY:${version%.*}" --tag "$REPOSITORY:latest" \
            $(printf "$REPOSITORY@sha256:%s " $(ls digests))
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true

  # The image as a machine pulls it, with no login: the package is public (README, "Releasing").
  try:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      SLIDR_IMAGE: ghcr.io/slidrhq/library@${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull it with no login
        run: docker pull "$SLIDR_IMAGE"
      - run: node --import ./server/node.mjs --test docker/test/image.test.ts
      - run: |
          sudo apt-get install -y --no-install-recommends expect
          node --import ./server/node.mjs --test --test-concurrency=1 install/test/install.test.ts

  release:
    needs: [check, publish, try]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The install script, its image pinned
        run: |
          version=${{ needs.check.outputs.version }}
          image="$REPOSITORY:$version@${{ needs.publish.outputs.digest }}"
          mkdir -p release
          sed -e "s|^VERSION=\"\"$|VERSION=\"$version\"|" -e "s|^IMAGE=\"\"$|IMAGE=\"$image\"|" \
            install/install.sh > release/install.sh
          grep -q "^IMAGE=\"$image\"$" release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256)
      # Who built the script, checked by `gh attestation verify install.sh --repo slidrhq/library`,
      # and by `slidr-library update` where GitHub's CLI is: its SHA-256 only finds a download
      # that went wrong, since it comes from the same release.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/install.sh
      - name: The release
        run: |
          gh release create "$GITHUB_REF_NAME" release/install.sh release/install.sh.sha256 \
            --title "Slidr Library ${{ needs.check.outputs.version }}" \
            --notes "A local Slidr Library, for Linux, in Docker (README, \"A local library\").

          \`\`\`sh
          curl -fsSLO https://github.com/slidrhq/library/releases/download/$GITHUB_REF_NAME/install.sh
          curl -fsSLO https://github.com/slidrhq/library/releases/download/$GITHUB_REF_NAME/install.sh.sha256
          sha256sum -c install.sh.sha256
          sudo bash install.sh
          \`\`\`

          The image: \`$REPOSITORY:${{ needs.check.outputs.version }}@${{ needs.publish.outputs.digest }}\`" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
