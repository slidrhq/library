name: Release

# A release of the local library (docs/PLAN.md P13, P14), from a tag v<version> that package.json
# names: its image for x86-64 and ARM64 on ghcr.io, attested, and as a file for each, for a machine
# that does not reach ghcr.io; that image tried as a machine pulls it, and as it loads the file;
# and a GitHub release with the install script that pins it by digest, and the files by their
# SHA-256. It deploys nothing to Cloudflare (deploy.yml does, from main).
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

env:
  REPOSITORY: ghcr.io/slidrhq/library

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: The tag is package.json's version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "The tag $GITHUB_REF_NAME is not v$version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  image:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.list.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One image for both architectures, tagged
        id: list
        run: |
          version=${{ needs.check.outputs.version }}
          docker buildx imagetools create \
            --tag "$REPOSITORY:$version" --tag "$REPOSITORY:${version%.*}" --tag "$REPOSITORY:latest" \
            $(printf "$REPOSITORY@sha256:%s " $(ls digests))
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true

  # The image as a file for each architecture, as `docker load` takes it, for a machine that does
  # not reach ghcr.io (install.sh --image-file): copied from the very image pushed, by its digest.
  files:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: A file of the image for each architecture
        run: |
          command -v skopeo >/dev/null ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo; }
          echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          mkdir -p files
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "$arch" \
              "docker://$REPOSITORY@$DIGEST" "docker-archive:files/image.tar:$REPOSITORY:$VERSION"
            gzip -n < files/image.tar > "files/slidr-library-$VERSION-linux-$arch.tar.gz"
            rm files/image.tar
          done
          ls -l files
        env:
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-files
          path: files/*.tar.gz
          retention-days: 1
          compression-level: 0

  # The image as a machine pulls it, with no login: the package is public (README, "Releasing");
  # and as a machine with no way out loads its file.
  try:
    needs: [check, publish, files]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      SLIDR_IMAGE: ghcr.io/slidrhq/library@${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: image-files
          path: files
      - name: Pull it with no login
        run: docker pull "$SLIDR_IMAGE"
      - run: node --import ./server/node.mjs --test docker/test/image.test.ts
      - run: |
          sudo apt-get install -y --no-install-recommends expect
          node --import ./server/node.mjs --test --test-concurrency=1 install/test/install.test.ts
        env:
          SLIDR_IMAGE_FILE: ${{ github.workspace }}/files/slidr-library-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: [check, publish, files, try]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-files
          path: release
      - name: The install script, its image pinned, and its files
        run: |
          version=${{ needs.check.outputs.version }}
          image="$REPOSITORY:$version@${{ needs.publish.outputs.digest }}"
          amd64=$(sha256sum "release/slidr-library-$version-linux-amd64.tar.gz" | cut -d ' ' -f 1)
          arm64=$(sha256sum "release/slidr-library-$version-linux-arm64.tar.gz" | cut -d ' ' -f 1)
          sed -e "s|^VERSION=\"\"$|VERSION=\"$version\"|" -e "s|^IMAGE=\"\"$|IMAGE=\"$image\"|" \
            -e "s|^IMAGE_FILE_AMD64=\"\"$|IMAGE_FILE_AMD64=\"$amd64\"|" \
            -e "s|^IMAGE_FILE_ARM64=\"\"$|IMAGE_FILE_ARM64=\"$arm64\"|" \
            install/install.sh > release/install.sh
          grep -q "^IMAGE=\"$image\"$" release/install.sh
          grep -q "^IMAGE_FILE_AMD64=\"$amd64\"$" release/install.sh
          grep -q "^IMAGE_FILE_ARM64=\"$arm64\"$" release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256)
      # Who built the script and the files, checked by `gh attestation verify <file> --repo
      # slidrhq/library`, and the script by `slidr-library update` where GitHub's CLI is: its
      # SHA-256 only finds a download that went wrong, since it comes from the same release. The
      # script checks each file by the SHA-256 written into it.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/install.sh
            release/*.tar.gz
      - name: The release
        run: |
          gh release create "$GITHUB_REF_NAME" release/install.sh release/install.sh.sha256 \
            release/*.tar.gz \
            --title "Slidr Library ${{ needs.check.outputs.version }}" \
            --notes "A local Slidr Library, for Linux, in Docker (README, \"A local library\").

          \`\`\`sh
          curl -fsSLO https://github.com/slidrhq/library/releases/download/$GITHUB_REF_NAME/install.sh
          curl -fsSLO https://github.com/slidrhq/library/releases/download/$GITHUB_REF_NAME/install.sh.sha256
          sha256sum -c install.sh.sha256
          sudo bash install.sh
          \`\`\`

          On a machine that does not reach ghcr.io, the image is the file of its architecture, \`slidr-library-${{ needs.check.outputs.version }}-linux-<amd64|arm64>.tar.gz\`, brought beside install.sh: \`sudo bash install.sh --image-file <it>\` (README, \"On a closed network\").

          The image: \`$REPOSITORY:${{ needs.check.outputs.version }}@${{ needs.publish.outputs.digest }}\`" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
